root = "."
tmp_dir = "bin/.air"

[build]
cmd = "go build -o ./bin/.air/telemetryprocessor ./apps/telemetryprocessor/cmd/server"
entrypoint = "bin/.air/telemetryprocessor"
include_ext = ["go"]
include_dir = ["apps/telemetryprocessor"]
exclude_dir = ["bin"]
delay = 200

[log]
time = false

[misc]
clean_on_exit = true
