[tools]
air = "1.67.4"
go = "1.26.6"

[tasks.build-cli]
description = "Build the telemetryIngestor CLI"
run = "go build -o bin/telemetryingestor ./apps/telemetryingestor"

[tasks.build-processor]
description = "Build the telemetry processor microservice"
run = "go build -o bin/telemetryprocessor ./apps/telemetryprocessor/cmd/server"

[tasks.run-processor]
description = "Run the telemetry processor microservice"
run = "go run ./apps/telemetryprocessor/cmd/server"

[tasks.dev-processor]
description = "Run the telemetry processor with hot reload (air)"
run = "air -c .air.toml"

[tasks.test]
description = "Run all tests in the workspace"
run = "{% raw %}go test $(go list -m -f '{{.Dir}}/...'){% endraw %}"

[tasks.vet]
description = "Vet all modules in the workspace"
run = "{% raw %}go vet $(go list -m -f '{{.Dir}}/...'){% endraw %}"
